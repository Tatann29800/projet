name: Nettoyage du stockage GitHub Actions

on:
  push:
    paths:
      - ".github/workflows/cleanup-actions-storage.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: cleanup-actions-storage
  cancel-in-progress: false

jobs:
  cleanup:
    name: Supprimer les anciennes executions (garder les 3 dernieres)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Supprimer les anciens runs et leurs artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const keepCount = 3;
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, per_page: 100 }
            );
            runs.sort((a, b) => {
              const dateOrder = Date.parse(b.created_at) - Date.parse(a.created_at);
              return dateOrder || b.id - a.id;
            });

            // Garder les trois runs les plus recents, plus le run actuel.
            // Ne jamais interrompre une execution en cours.
            const protectedIds = new Set(runs.slice(0, keepCount).map(r => r.id));
            protectedIds.add(context.runId);
            const deletable = runs.filter(r =>
              r.status === 'completed' && !protectedIds.has(r.id)
            );

            let deleted = 0;
            const failures = [];
            for (const run of deletable) {
              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner, repo, run_id: run.id
                });
                deleted++;
              } catch (error) {
                failures.push('Run #' + run.id + ': ' + error.message);
                core.warning('Impossible de supprimer ' + run.id + ': ' + error.message);
              }
            }

            // Les runs supprimes ne sont plus affiches dans Actions.
            // Leurs logs et les artifacts rattaches sont egalement supprimes.
            core.info('Executions trouvees : ' + runs.length);
            core.info('Executions protegees : ' + protectedIds.size);
            core.info('Anciennes executions supprimees : ' + deleted);

            await core.summary
              .addHeading('Nettoyage de l\'historique GitHub Actions')
              .addRaw('Depot : ' + owner + '/' + repo + '\n\n')
              .addRaw('Executions trouvees : ' + runs.length + '\n\n')
              .addRaw('Executions supprimees : ' + deleted + '\n\n')
              .addRaw('Executions recentes conservees : au moins ' + Math.min(keepCount, runs.length) + '\n\n')
              .addRaw('Erreurs : ' + failures.length + '\n')
              .write();
            if (failures.length) {
              core.setFailed('Erreur lors de la suppression de ' + failures.length + ' execution(s)');
            }
